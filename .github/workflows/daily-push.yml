name: GitHub Trending Daily Push

on:
  schedule:
    # GitHub Actions 的 cron 用 UTC；UTC 22:00 = 北京时间 06:00
    # 提前 2 小时对冲 GitHub schedule 队列延迟（实测可延迟近 2 小时）
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch trending and push via ServerChan
        env:
          SCT_SENDKEY: ${{ secrets.SCT_SENDKEY }}
        run: python push.py
